<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#EAB308"/>
      <stop offset="70%" stop-color="#CA8A04"/>
      <stop offset="100%" stop-color="#A16207"/>
    </linearGradient>
    
    <!-- Royal Dark Blue Background -->
    <linearGradient id="royalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#royalDark)"/>

  <!-- Outer Gold Octagonal Shield -->
  <polygon points="256,40 440,100 480,256 440,412 256,472 72,412 32,256 72,100" 
           fill="url(#royalDark)" stroke="url(#goldGrad)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Inner Gold Dotted Shield -->
  <polygon points="256,64 416,116 452,256 416,396 256,448 96,396 60,256 96,116" 
           fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.85"/>

  <!-- Top Arch Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="256,90 264,108 284,108 268,120 274,138 256,126 238,138 244,120 228,108 248,108"/>
    <polygon points="190,110 197,125 212,125 199,135 204,150 190,140 176,150 181,135 168,125 183,125" opacity="0.9"/>
    <polygon points="322,110 329,125 344,125 331,135 336,150 322,140 308,150 313,135 300,125 315,125" opacity="0.9"/>
  </g>

  <!-- Royal Crown -->
  <g fill="url(#goldGrad)" filter="url(#goldGlow)">
    <path d="M140 260 L165 160 L220 210 L256 130 L292 210 L347 160 L372 260 Z"/>
    <circle cx="165" cy="150" r="12" fill="#FEF08A"/>
    <circle cx="256" cy="120" r="16" fill="#FEF08A"/>
    <circle cx="347" cy="150" r="12" fill="#FEF08A"/>
    <rect x="140" y="260" width="232" height="24" rx="8" fill="url(#goldGrad)" stroke="#854D0E" stroke-width="4"/>
  </g>

  <!-- Monogram Logo Initials (HM for Hotel Management) -->
  <text x="256" y="375" text-anchor="middle" fill="url(#goldGrad)" font-size="96" font-weight="900" font-family="Georgia, serif" letter-spacing="8">
    HM
  </text>
  
  <!-- Subtitle -->
  <text x="256" y="420" text-anchor="middle" fill="#FDE047" font-size="24" font-weight="800" font-family="sans-serif" letter-spacing="4" opacity="0.95">
    HOTEL MANAGEMENT
  </text>
</svg>
